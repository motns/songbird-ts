name: Node Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
#        node-version: [22.x, 24.x, 26.x]
        node-version: [26.x]
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install

      - name: Format check
        run: pnpm fmt:check
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test

